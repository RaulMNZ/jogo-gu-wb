<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minas — abra as casas e evite as bombas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Minas</h1>
      <p class="sub">Abra casas seguras. Uma bomba encerra a rodada.</p>
    </div>
    <div class="balance">
      <div class="label">Saldo</div>
      <div class="value" id="balance">1.000</div>
    </div>
  </header>

  <div class="layout">
    <section class="board-col" aria-label="Tabuleiro">
      <div class="stats">
        <div class="stat"><div class="k">Multiplicador</div><div class="v" id="statMult">1,00×</div></div>
        <div class="stat live"><div class="k">Você sacaria</div><div class="v" id="statPayout">0</div></div>
        <div class="stat"><div class="k">Próxima gema</div><div class="v" id="statNext">—</div></div>
      </div>
      <div class="grid" id="grid" role="group" aria-label="25 casas"></div>
      <p class="message" id="message" aria-live="polite"></p>
    </section>

    <aside class="controls panel" aria-label="Controles">
      <div class="field">
        <label for="bet">Aposta</label>
        <div class="bet-row">
          <input type="number" id="bet" min="1" step="1" value="50" inputmode="numeric">
          <button class="chip" id="half" type="button" aria-label="Metade da aposta">½</button>
          <button class="chip" id="double" type="button" aria-label="Dobrar a aposta">2×</button>
          <button class="chip" id="max" type="button">Máx</button>
        </div>
      </div>

      <div class="field">
        <div class="mines-head">
          <label class="lbl" for="mines">Bombas</label>
          <output id="minesOut" for="mines">3</output>
        </div>
        <input type="range" id="mines" min="1" max="24" value="3">
        <p class="hint">Mais bombas pagam mais por gema, mas o risco sobe.</p>
      </div>

      <button class="primary" id="action" type="button">Começar</button>
      <button class="secondary" id="reset" type="button" hidden>Recomeçar com 1.000</button>

      <div class="history" id="historyWrap" hidden>
        <div class="lbl">Últimas rodadas</div>
        <div class="hist-list" id="history"></div>
      </div>
    </aside>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
